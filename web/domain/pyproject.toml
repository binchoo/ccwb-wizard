[project]
name = "ccwb-domain"
version = "0.0.0"
description = "Pure Python domain module for ccwb web wizard (Config, providers, materialize, ...)"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
keywords = ["aws", "bedrock", "claude", "ccwb", "domain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Empty — Domain unit will add via `uv add` (Q3=D).
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccwb_domain"]
