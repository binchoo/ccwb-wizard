# Pre-commit hooks for CloudFormation and YAML validation
# Run `pre-commit install` to set up the git hook scripts
# See https://pre-commit.com for more information

repos:
  # YAML syntax validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        name: Validate YAML syntax
        args: ['-d', 'relaxed']
        files: \.(yaml|yml)$

  # CloudFormation template validation
  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v0.83.8
    hooks:
      - id: cfn-lint
        name: Validate CloudFormation templates
        files: deployment/infrastructure/.*\.(yaml|yml)$
        args: ['--ignore-checks', 'W3002']  # W3002 is for optional resource properties

  # Custom AWS validation (requires AWS credentials)
  - repo: local
    hooks:
      - id: validate-cfn-templates
        name: Validate CloudFormation with AWS CLI
        entry: scripts/validate-cloudformation.sh
        language: script
        files: deployment/infrastructure/.*\.(yaml|yml)$
        pass_filenames: true
        # This hook will only run if AWS credentials are configured
        # It provides additional validation beyond cfn-lint

  # Python code quality - Ruff (fast linter and formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        name: Lint Python with Ruff (auto-fix)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(web/(domain|backend|binaries)/.*\.py|deployment/infrastructure/lambda-functions/.*\.py)$

      - id: ruff-format
        name: Format Python with Ruff
        files: ^(web/(domain|backend|binaries)/.*\.py|deployment/infrastructure/lambda-functions/.*\.py)$

  # Note: smoke test hook removed by build-tooling unit.
  # The legacy hook ran `cd source && poetry run python -m pytest tests/test_smoke.py -q`,
  # which depended on the now-deleted source/ tree and on poetry. Subsequent
  # units (Domain, Backend, Frontend, Credential-Provider Rewrite) are
  # responsible for adding their own per-unit test hooks if desired.
