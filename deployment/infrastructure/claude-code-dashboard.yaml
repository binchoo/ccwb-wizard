AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudWatch dashboard for Claude Code on Bedrock. Replaces the OTEL/PromQL dashboard
  with widgets that query Custom Metrics published by the bedrock-logging stack
  metric filters (namespace ClaudeCodeBedrock, dimensions User/Team/ModelId).

Parameters:
  ProfileName:
    Type: String
    Description: ccwb profile name; appears in dashboard title and resource naming.

  MetricNamespace:
    Type: String
    Default: ClaudeCodeBedrock
    Description: CloudWatch metric namespace populated by bedrock-logging metric filters.

  Region:
    Type: String
    Default: us-east-1
    Description: AWS region the dashboard should query (matches bedrock-logging region).

Resources:
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProfileName}-claude-code-bedrock
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# Claude Code on Bedrock — ${ProfileName}\nUser attribution flows through `ANTHROPIC_CUSTOM_HEADERS`. Untagged invocations indicate users who skipped install.sh."
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 2, "width": 6, "height": 4,
              "properties": {
                "title": "Input tokens (24h)",
                "view": "singleValue",
                "metrics": [[ "${MetricNamespace}", "InputTokensByUser", { "stat": "Sum", "label": "Input" } ]],
                "region": "${AWS::Region}",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 6, "y": 2, "width": 6, "height": 4,
              "properties": {
                "title": "Output tokens (24h)",
                "view": "singleValue",
                "metrics": [[ "${MetricNamespace}", "OutputTokensByUser", { "stat": "Sum", "label": "Output" } ]],
                "region": "${AWS::Region}",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 6, "height": 4,
              "properties": {
                "title": "Invocations (24h)",
                "view": "singleValue",
                "metrics": [[ "${MetricNamespace}", "InvocationCount", { "stat": "Sum" } ]],
                "region": "${AWS::Region}",
                "period": 86400
              }
            },
            {
              "type": "metric",
              "x": 18, "y": 2, "width": 6, "height": 4,
              "properties": {
                "title": "Untagged invocations (24h)",
                "view": "singleValue",
                "metrics": [[ "${MetricNamespace}", "UntaggedInvocations", { "stat": "Sum", "label": "No requestMetadata" } ]],
                "region": "${AWS::Region}",
                "period": 86400
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Top users by token usage (input + output)",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ { "expression": "SEARCH('Namespace=\"${MetricNamespace}\" MetricName=\"InputTokensByUser\"', 'Sum', 300)", "label": "Input by user", "id": "in_search" } ],
                  [ { "expression": "SEARCH('Namespace=\"${MetricNamespace}\" MetricName=\"OutputTokensByUser\"', 'Sum', 300)", "label": "Output by user", "id": "out_search" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Tokens by team",
                "view": "timeSeries",
                "stacked": true,
                "metrics": [
                  [ { "expression": "SEARCH('Namespace=\"${MetricNamespace}\" MetricName=\"InputTokensByUser\" Team', 'Sum', 300)", "label": "Input by team" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            },

            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Tokens by model",
                "view": "timeSeries",
                "stacked": true,
                "metrics": [
                  [ { "expression": "SEARCH('Namespace=\"${MetricNamespace}\" MetricName=\"InputTokensByUser\" ModelId', 'Sum', 300)", "label": "Input by model" } ]
                ],
                "region": "${AWS::Region}",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Invocation rate (per minute)",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [[ "${MetricNamespace}", "InvocationCount", { "stat": "Sum", "period": 60, "label": "Invocations / min" } ]],
                "region": "${AWS::Region}",
                "period": 60
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: !Ref Dashboard
    Description: CloudWatch dashboard name for Claude Code on Bedrock.
    Export:
      Name: !Sub ${AWS::StackName}-DashboardName

  DashboardURL:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProfileName}-claude-code-bedrock
    Description: Console URL to open the dashboard.
