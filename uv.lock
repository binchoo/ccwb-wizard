version = 1
revision = 2
requires-python = ">=3.10, <3.13"

[manifest]
members = [
    "ccwb-domain",
    "ccwb-wizard",
    "ccwb-workspace",
]

[[package]]
name = "ccwb-domain"
version = "0.0.0"
source = { editable = "web/domain" }

[[package]]
name = "ccwb-wizard"
version = "0.0.0"
source = { editable = "web/backend" }

[[package]]
name = "ccwb-workspace"
version = "0.0.0"
source = { virtual = "." }
